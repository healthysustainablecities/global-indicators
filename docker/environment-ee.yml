name: ghsci
channels:
  - conda-forge
dependencies:
  - python=3.14.*
  - osmnx=2.1.* # OpenStreetMap network retrieval and analysis
  - gdal>=3.13.1 # GDAL and OGR libraries (dependabot patch; requires rasterio>=1.5.1, which the solver pulls in)
  - libgdal-pg # PostgreSQL GDAL extension
  - pandas=2.3.* # pandas 2.3 uses ADBC for reads; SQLAlchemy retained for geopandas/DDL
  - nicegui=3.15.* # web app framework
  - fpdf2=2.8.*, >=2.8.8 # pdf templating (dependabot patch)
  - sqlalchemy=2.0.* # SQL connectivity with PostgreSQL (geopandas, DDL, writes)
  - fonttools>=4.61.0 # font manipulation (dependabot patch)
  - jupyterlab=4.6.*, >=4.6.4 # code notebooks / web interface (dependabot patch)
  - tqdm=4.*, >=4.66.3 # progress bar
  - adbc-driver-postgresql # Apache Arrow PostgreSQL driver (data access w/ Pandas>=2.2.*)
  - pyarrow # Apache Arrow for high-performance data processing
  - openpyxl # Excel file reading
  - babel # language localization
  - cartopy # map plotting
  - contextily # basemaps and map styling
  - ipywidgets # for jupyter lab progress bar
  - geoalchemy2 # Geometry datatype extension for SQL Alchemy
  - rasterio # raster data reading
  - psycopg2 # PostgreSQL connection
  - pyyaml # YAML parsing
  - yamllint # YAML linting
  - uharfbuzz # text shaping for font rendering
  - pillow>=13.0.0 # image handling (dependabot patch)
  - certifi>=2026.10.18 # SSL certificate bundle (dependabot patch: compromised emSign CAs)
  - nbconvert # notebook export (with pandoc) from Jupyter Lab
  - bleach>=6.4.0 # dependabot patch; otherwise held at 6.3.0, since its css extra caps tinycss2 <1.5
  - earthengine-api # Google Earth Engine API
  - google-cloud-storage>=3.11 # required by the earthengine CLI; without this pin the solver prefers grpcio-status (protobuf>=7) and falls back to google-cloud-storage 2.3.0, which imports the `cgi` module removed in Python 3.14
  - geemap # Google Earth Engine mapping and spatial tools
  - geedim # High-resolution Google Earth Engine image downloading for LPUGS raster
  - pip # python package installer
  - pip:
    - gtfs-lite # GTFS data reading
    - arabic-reshaper # for Arabic and Persian text shaping
    - python-bidi # for bi-directional text support in matplotlib
    - pygeometa # metadata templating tools
