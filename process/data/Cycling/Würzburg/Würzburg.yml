  data:  "Cycling/Würzburg/Wurzburg.geojson"
  source: ""
  publication_date: 2019-02-01
  url: ""
  licence: CC-BY-4.0
  urban_intersection: False
  citation: ""
  notes: ""
population:
  name: "Global Human Settlements population data: 2020, Mollweide (EU JRC, 2022)"
  data_dir: Cycling/Würzburg/GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0_R4_C19
  data_type: raster:Int64
  resolution: 100m
  raster_band: 1
  raster_nodata: -200
  pop_min_threshold: 1
  crs_name: Mollweide
  crs_standard: ESRI
  crs_srid: 54009
  source_url: ""
  year_published: 2023
  year_target: 2025
