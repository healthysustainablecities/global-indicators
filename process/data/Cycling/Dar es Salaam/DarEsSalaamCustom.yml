###########################################################
## GHSCI study region configuration (YAML).
## Cycling indicators prototype study 2026
##
## Dar es Salaam CUSTOM-DATA SENSITIVITY ANALYSIS: identical to
## DarEsSalaam.yml (the OSM-only analysis already run) except that
## Climate Risk Database custom destinations (points_of_interest /
## areas_of_interest) are pooled with the OpenStreetMap-derived
## destinations.  Analogous to the MexicoCityProper companion run.
## Distinct codename -> database 'daressalaamcustom' and outputs in
## _study_region_outputs/DarEsSalaamCustom, so it does not disturb
## the original run.
##
## Run example:
## ------------
## import ghsci
## r = ghsci.Region("data/Cycling/Dar es Salaam/DarEsSalaamCustom")
## r.analysis()
###########################################################
---
name: Dar es Salaam
year: 2025
country: Tanzania
country_code: TZ
continent: Africa
crs:
  name: WGS 84 / UTM zone 37S
  standard: EPSG
  srid: 32737
study_region_boundary:
  data: "Cycling/Dar es Salaam/dar_es_salaam_boundary_NBS.geojson"
  source: ""
  publication_date: 2026-04-04
  url: ""
  licence: CC-BY-4.0
  urban_intersection: false
  citation: ""
  notes: "Provided by Msilikale Msilanga on 4 April 2026"
population:
  name: "Global Human Settlements population data: 2020, Mollweide (EU JRC, 2022)"
  data_dir: Cycling/Dar es Salaam/GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0_R10_C22
  data_type: raster:Int64
  resolution: 100m
  raster_band: 1
  raster_nodata: -200
  pop_min_threshold: 1
  crs_name: Mollweide
  crs_standard: ESRI
  crs_srid: 54009
  source_url: ""
  year_published: 2023
  year_target: 2025
  date_acquired: 20260429
  licence: CC BY 4.0
  citation: ""
OpenStreetMap:
  data_dir: Cycling/Dar es Salaam/coastal-2026-04-29.osm.pbf
  source: OpenStreetMap.fr
  publication_date: 20260429
  licence: ODbL
  url: https://download.openstreetmap.fr/extracts/africa/tanzania/coastal.osm.pbf
  note:
## Optional custom destinations to import in addition to those from OpenStreetMap.
## Sourced from the Climate Risk Database (https://crd.resilienceacademy.ac.tz/),
## identified by Msilikale Msilanga (survey response, Dec 2025) as the
## supplementary source for transport-related spatial data in Dar es Salaam, and
## recommended layer-by-layer in his 25 May 2026 e-mail (Correspondence/Dar es
## Salaam/Msilikale Msilanga - 2026-05-25.pdf): PT stops (795/796, "best
## coverage of the four"), Retail Services (682/683, "partial - filter by
## attribute to pull out only food-relevant features"), 'shops' (666,
## "probably not independent of your OSM baseline" - rejected), Urban Greening
## open spaces (749, "weakest ... can't be used directly for a citywide
## accessibility indicator" - rejected).  The Open Areas layer (709) used for
## public open space below was identified in our own CRD catalogue review and
## is NOT among his explicit recommendations - to be confirmed with him.
## Layers were collected by the Ramani Huria community-mapping project and
## exported from the CRD via WFS as GeoJSON (EPSG:4326) on 15 July 2026.
## All entries supplement (replace: false) the OpenStreetMap-derived
## destinations; imports are cropped to the buffered urban study region.
## Note: Ramani Huria data were largely also uploaded to OpenStreetMap, so some
## duplication with the OSM extract is expected (harmless for
## distance-to-closest accessibility measures).
points_of_interest:
  fresh_food_market:
    ## Ramani Huria field-mapped retail service polygons (2018; n=1,686), filtered
    ## to fresh-food values aligned with the GHSCI OSM fresh_food_market
    ## definition (supermarket, greengrocer, butcher, bakery, seafood, dairy,
    ## marketplace) plus local variants observed in the data ('Genge' = fresh
    ## produce stall, 'Food Shop', 'Min Supermarket'); 112 features citywide.
    ## Polygon features; centroids are taken on import.
    replace: false
    data_sources:
      - data: Cycling/Dar es Salaam/Climate Risk Database/dar_es_salaam_shops_polygon.geojson -where "shop IN ('supermarket','Min Supermarket','greengrocer','butcher','bakery','seafood','dairy','food','Food Shop','Genge') OR amenity = 'marketplace'"
        source: Dar es Salaam Retail Services (Ramani Huria), Climate Risk Database
        publication_date: 2018-12-31
        url: https://crd.resilienceacademy.ac.tz/catalogue/#/dataset/682
        licence: ODbL
        citation: "Resilience Academy / Ramani Huria (2018). Dar es Salaam Retail Services [Data set]. Climate Risk Database."
  convenience:
    ## Same Ramani Huria retail layer filtered to the GHSCI convenience
    ## definition values present in the data (convenience stores and kiosks;
    ## 679 features).  Pooled with fresh_food_market in the lenient
    ## fresh_food_pooled indicator.
    replace: false
    data_sources:
      - data: Cycling/Dar es Salaam/Climate Risk Database/dar_es_salaam_shops_polygon.geojson -where "shop IN ('convenience','kiosk')"
        source: Dar es Salaam Retail Services (Ramani Huria), Climate Risk Database
        publication_date: 2018-12-31
        url: https://crd.resilienceacademy.ac.tz/catalogue/#/dataset/682
        licence: ODbL
        citation: "Resilience Academy / Ramani Huria (2018). Dar es Salaam Retail Services [Data set]. Climate Risk Database."
  pt_any:
    ## Daladala bus stops (n=279; Ramani Huria, covering 49 of 95 wards) and
    ## DART Bus Rapid Transit Phase I stops (n=34, mapped 2018).
    replace: false
    data_sources:
      - data: Cycling/Dar es Salaam/Climate Risk Database/dar_es_salaam_public_transportation_stops.geojson
        source: Dar es Salaam Public Transportation Stops (Ramani Huria), Climate Risk Database
        publication_date: 2021-11-29
        url: https://crd.resilienceacademy.ac.tz/catalogue/#/dataset/795
        licence: ODbL
        citation: "Resilience Academy / Ramani Huria (2021). Dar es Salaam Public Transportation Stops [Data set]. Climate Risk Database."
      - data: Cycling/Dar es Salaam/Climate Risk Database/dar_es_salaam_brt_stops.geojson
        source: Dar es Salaam BRT Stops Phase I (Ramani Huria), Climate Risk Database
        publication_date: 2021-01-20
        url: https://crd.resilienceacademy.ac.tz/catalogue/#/dataset/796
        licence: "Not specified (Climate Risk Database terms); attribution Resilience Academy, University of Turku"
        citation: "Resilience Academy / Ramani Huria (2021). Dar es Salaam BRT Stops (Phase I) [Data set]. Climate Risk Database."
## Optional custom areas of interest supplementing OpenStreetMap-derived open space.
areas_of_interest:
  public_open_space:
    ## Ramani Huria 'Open Areas' — publicly accessible undeveloped land
    ## (n=1,079) — filtered to green/recreational classes consistent with the
    ## GHSCI open space definition (recreation grounds, grass, meadow,
    ## greenfield, forest, playgrounds; plus park/playground/common/pitch/
    ## garden leisure features, excluding those on cemetery/farmyard land and
    ## golf courses): 353 polygons.  Pitches are retained deliberately - open
    ## football grounds are archetypal public open space in Dar es Salaam.
    ## Excluded classes: cemetery, dump/landfill, industrial, garages,
    ## residential, farmland/farmyard, military, brownfield, reservoir,
    ## salt_pond, quarry etc.
    ## The companion 'Dar Urban Greening Project - Open spaces' CRD layer was
    ## reviewed and NOT used: it covers only 15 sampled areas, and of its 22
    ## 'Public' polygons only 4 are gardens/recreation grounds (the rest
    ## cemeteries, landfills, brownfields).
    replace: false
    data_sources:
      - data: Cycling/Dar es Salaam/Climate Risk Database/dar_es_salaam_open_areas.geojson -where "(landuse IN ('recreation_ground','grass','meadow','greenfield','forest','playground','village_green') OR (leisure IN ('park','playground','common','pitch','garden') AND (landuse IS NULL OR landuse NOT IN ('cemetery','farmyard')))) AND (leisure IS NULL OR leisure <> 'golf_course')"
        source: Dar es Salaam Open Areas (Ramani Huria), Climate Risk Database
        publication_date: 2019-09-23
        url: https://crd.resilienceacademy.ac.tz/catalogue/#/dataset/709
        licence: ODbL
        citation: "Resilience Academy / Ramani Huria (2019). Dar es Salaam Open Areas [Data set]. Climate Risk Database."
custom_aggregations:
  # Official Tanzania NBS 2022 wards (full Dar coverage), supplied by Dr M. Msilanga;
  # population-weighted aggregation of grid indicators (incl. cycling) to wards.
  wards:
    data: Cycling/Dar es Salaam/dar_es_salaam_wards_NBS_2022.geojson
    id: OBJECTID
    keep_columns: ward_name, dist_name, counc_name
    aggregation_source: grid
    weight: pop_est
reporting:
   templates:
     - spatial
   publication_ready: false
   study_region_context_basemap: 'satellite'
   doi: ""
   languages:
     English:
       name: Dar es Salaam
       country: Tanzania
       summary:  Placeholder
       context:
         - City context:
             - summary: Edit the region configuration file to provide background context for your study region. Please briefly summarise the location, history and topography, as relevant.
## Cycling Level of Traffic Stress (LTS) accessibility workflow.
cycling_indicators:
  speed_limits:
    # Dar es Salaam per-highway default speeds (km/h), curated by Dr M. Msilanga
    # (Correspondence/Dar es Salaam/dar_es_salaam_road_speeds.csv).
    defaults:
      motorway: 100
      motorway_link: 60
      trunk: 50
      trunk_link: 40
      primary: 50
      primary_link: 40
      secondary: 50
      secondary_link: 30
      tertiary: 40
      tertiary_link: 30
      residential: 30
      road: 30
      unclassified: 30
      living_street: 15
      service: 20
      cycleway: 20
      track: 20
  # Cycling not permitted where the same CSV records "Is cycling allowed? (Dar) = No".
  # no_cycle: [motorway, motorway_link, pedestrian, footway, path, corridor, steps]
  # Note: we allow for penalised (x3 distance cost; to approximate walk vs cycle time) dismount along pedestrian, footway and path 
  #       I think putting these as no cycle may block this option, so testing this out here to evaluate impact
  no_cycle: [motorway, motorway_link, corridor, steps]
  # Exact in-process Dijkstra engine (equivalence-gated against pgRouting, Würzburg
  # 2026-07-04: access columns identical, distances within rounding).
  routing_engine: inmemory
  distances: [500, 1000, 2000, 5000]
  ## Accessibility measure contrasts: ordered pairs of measures calculated and
  ## juxtaposed in the validation report (the first pair is the established
  ## headline contrast; later pairs render below it as alternative contrasts
  ## for each reporting item).  Measures: lts1 (fully LTS 1 routes),
  ## low_stress (fully LTS 1-2 routes), danger_weighted (all streets routable,
  ## higher-stress length penalised).  Every measure named in a contrast is
  ## calculated.  Default if omitted: [[low_stress, danger_weighted]].
  contrasts:
    - [low_stress, danger_weighted]
    - [lts1, low_stress]
  destinations:
    - {name: fresh_food_market,       category: food, variant: strict,  layer: destinations, where: "dest_name = 'fresh_food_market'"}
    - {name: fresh_food_pooled,       category: food, variant: lenient, layer: destinations, where: "dest_name IN ('fresh_food_market', 'convenience')"}
    - {name: public_open_space_large, category: pos,  variant: strict,  layer: aos_public_large_nodes_30m_line}
    - {name: public_open_space_any,   category: pos,  variant: lenient, layer: aos_public_any_nodes_30m_line}
    - {name: pt_frequent,             category: pt,   variant: strict,  layer: pt_stops_headway, where: "headway <= 20"}
    - {name: pt_any,                  category: pt,   variant: lenient, layer: destinations, where: "dest_name = 'pt_any'"}
  activity_centres:
    walk_threshold: 400
    categories: [food, pos, pt]
    tiers:
      local: lenient
      complete: strict
  # Context rendered into the cycling validation report (_validation_report.py).
  validation:
    # Distinct validation-site identity: without these the site materials
    # would be slugged from the shared region name ('Dar es Salaam' ->
    # dar_es_salaam) and overwrite the OSM-only DarEsSalaam publication.
    site_slug: dar_es_salaam_custom
    site_label: Dar es Salaam (custom data)
    collaborator: Msilikale Msilanga (University of Turku / OpenMap Development Tanzania)
    provenance:
      - "Study region boundary: official Dar es Salaam Region boundary, Tanzania National Bureau of Statistics (NBS) 2022 Population and Housing Census, covering the five municipal councils (Kinondoni, Ilala, Temeke, Ubungo, Kigamboni); provided 4 April 2026."
      - "Ward geographies: NBS 2022 ward boundaries (dar_es_salaam_wards_NBS_2022), used for sub-city reporting."
      - "Default road speeds and cycling permissions by OSM highway type: completed consultation table based on Tanzania's Road Traffic Act (Cap 168) — 50 km/h urban default; the Dar es Salaam Expressway is the only true motorway (80-100 km/h); cycling not permitted on motorways or walking-only ways (incl. paths)."
      - "Custom destination data from the Climate Risk Database (https://crd.resilienceacademy.ac.tz/), the supplementary source identified by the local collaborator, supplementing OpenStreetMap: Ramani Huria retail services filtered to fresh food (n=112) and convenience (n=679) categories; daladala public transport stops (n=279) and BRT Phase I stops (n=34); and Ramani Huria 'Open Areas' filtered to green/recreational public open space classes (n=353 polygons). Exported via WFS 15 July 2026."
    limitations:
      - "First-pass analysis: Dar es Salaam had no results in the previous validation round, so this is an initial validation rather than a re-validation."
      - "Many roads lack posted speed limits, so legal default speeds apply broadly (as advised by the local collaborator); posted-speed coverage in OpenStreetMap is limited."
      - "Public transport stops mapped in OpenStreetMap (n=631) likely under-represent the daladala network; supplemented with Climate Risk Database daladala stops (which cover only 49 of 95 wards) and BRT Phase I stops, but coverage remains partial. No GTFS feed was configured, so the frequent-service (strict) public transport variant is not evaluated."
      - "Climate Risk Database layers are Ramani Huria community-mapping snapshots (retail 2018; open areas 2019; PT stops 2021) and may be outdated; much of this data was also uploaded to OpenStreetMap, so supplementation partly duplicates the OSM extract (harmless for distance-to-closest measures, but counts of destinations may double-count)."
      - "Actual peak-hour traffic speeds on arterials can drop well below posted/legal speeds due to congestion, which the Level of Traffic Stress classification (based on assumed speeds and volumes) does not capture."
      - "Dedicated cycling infrastructure is extremely limited in Dar es Salaam; results chiefly reflect low-speed local streets rather than protected facilities. The collaborator further cautions (25 May 2026) that OSM cycleway tags in Dar are often aspirational or denote footpaths alongside BRT corridors rather than protected lanes, so cycling-infrastructure-based indicators should be interpreted cautiously."
      - "The collaborator framed the CRD layers as suited to a sensitivity comparison against OpenStreetMap (particularly daladala stops, in the 49 wards covered) rather than as complete authoritative citywide sources; the current configuration pools them with OSM. A source-contrast sensitivity run (OSM-only vs pooled) remains a possible follow-up."
    actions:
      - "Made a first pass implementation of the Dar es Salaam analysis"
      - "Retrieved and configured Climate Risk Database custom data (fresh food/convenience retail, daladala + BRT stops, public open areas) as recommended by the local collaborator, pooled with OpenStreetMap defaults (2026-07-15)."
      - "Set up as an independent custom-data sensitivity analysis (DarEsSalaamCustom) alongside the OSM-only DarEsSalaam run, analogous to the Mexico City proper companion analysis (2026-07-15)."
    survey_feedback:
      - "Msilikale Msilanga (University of Turku / OpenMap Development Tanzania): highlights importance of considering motorcycles (bodaboda) sharing cycling infrastructure and adds that traffic stress includes motorcycles/Bajajs in bike lanes, informal parking, and absence of bike traffic signals."
      - "Recommends access thresholds of 10–20 min cycling on low-stress streets for schools, clinics, and jobs; and 5–10 min walking for basic needs."
      - "Notes OSM is a useful starting point for Dar es Salaam but is incomplete: many streets lack lane-separation, speed, traffic-volume, and bike-parking attributes; recent construction and seasonal flooding may not be current."
      - "Climate Risk Database (https://crd.resilienceacademy.ac.tz/) identified as a supplementary data source for transport-related spatial data; per-layer usability assessments provided by e-mail 25 May 2026 (PT stops best coverage; retail partial, needs attribute filtering; open space weakest)."
      - "ITDP conducted a non-motorised transport streets assessment for Dar es Salaam (~2017), and DART BRT corridor designs include NMT components; the collaborator offered to check whether shareable GIS versions exist to help validate OSM cycling infrastructure (pending)."
