## Cycling Level of Traffic Stress (LTS) accessibility workflow.
cycling_indicators:
  speed_limits:
    defaults:
      motorway: 100
      trunk: 80
      primary: 70
      secondary: 55
      tertiary: 50
      residential: 40
      living_street: 30
      service: 25
  no_cycle: [pedestrian, footway, steps, corridor]
  distances: [500, 1000, 2000, 5000]
  ## Accessibility measure contrasts: ordered pairs of measures calculated and
  ## juxtaposed in the validation report (the first pair is the established
  ## headline contrast; later pairs render below it as alternative contrasts
  ## for each reporting item).  Measures: lts1 (fully LTS 1 routes),
  ## low_stress (fully LTS 1-2 routes), danger_weighted (all streets routable,
  ## higher-stress length penalised).  Every measure named in a contrast is
  ## calculated.  Default if omitted: [[low_stress, danger_weighted]].
  contrasts:
    - [low_stress, danger_weighted]
    - [lts1, low_stress]
  destinations:
    - {name: fresh_food_market,       category: food, variant: strict,  layer: destinations, where: "dest_name = 'fresh_food_market'"}
    - {name: fresh_food_pooled,       category: food, variant: lenient, layer: destinations, where: "dest_name IN ('fresh_food_market', 'convenience')"}
    - {name: public_open_space_large, category: pos,  variant: strict,  layer: aos_public_large_nodes_30m_line}
    - {name: public_open_space_any,   category: pos,  variant: lenient, layer: aos_public_any_nodes_30m_line}
    - {name: pt_frequent,             category: pt,   variant: strict,  layer: pt_stops_headway, where: "headway <= 20"}
    - {name: pt_any,                  category: pt,   variant: lenient, layer: destinations, where: "dest_name = 'pt_any'"}
  activity_centres:
    walk_threshold: 400
    categories: [food, pos, pt]
    tiers:
      local: lenient
      complete: strict
  validation:
    collaborator: Ana Queralt & Javier Molina-García (University of Valencia)
    provenance:
      - "OpenStreetMap extract: spain-latest.osm.pbf (Geofabrik, 2025-11-03)."
      - "Population: GHS-POP merged tile R5_C18_C19 (EU JRC 2023, 100 m Mollweide)."
      - "No locally-supplied custom layers; no GTFS feed configured."
    limitations:
      - "Several restricted / non-residential zones appear as areas of low accessibility: the Port of Valencia cargo area, a wholesale market, a water treatment plant, airport non-accessible areas, and industrial zones. These are not residential areas, so their low accessibility scores are artefacts of the study region boundary encompassing non-habited land."
      - "Post-validation proposed action: investigate whether restricted-zone boundaries can be excluded from the study region; implement speed zone support for any applicable Valencia speed-limit zones."
    survey_feedback:
      - "Ana Queralt (University of Valencia): defines safe cycling infrastructure as facilities that prioritise safety and comfort through physical separation (protected lanes, traffic-calmed streets), good connectivity and directness, safe intersection crossings, and complementary end-of-trip facilities (secure parking)."
      - "Has access to official cycling infrastructure data for Valencia that can support validation."
      - "Javier Molina-García (University of Valencia): proposes ~5 km as an appropriate cycling access threshold for Valencia, based on local travel behaviour research; suggests ROC-curve analysis to empirically derive city-specific thresholds."
      - "Neither collaborator has direct access to travel-behaviour/mode-share data for Valencia at this stage."
