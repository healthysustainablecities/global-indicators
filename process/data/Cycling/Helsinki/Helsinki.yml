  data_dir: Cycling/Helsinki/GHS_POP_E2025_GLOBE_R2023A_54009_100_V1_0_R3_C20
  data_type: raster:Int64
  resolution: 100m
  raster_band: 1
  raster_nodata: -200
  pop_min_threshold: 1
  crs_name: Mollweide
  crs_standard: ESRI
