policy_review:
notes:
reporting:
   templates:
     - spatial
   publication_ready: false
   study_region_context_basemap: 'satellite'
   doi: ""
   languages:
     English:
       name: Melbourne
       country: Australia
       summary: Placeholder
       context:
         - City context:
             - summary: Edit the region configuration file to provide background context for your study region. Please briefly summarise the location, history and topography, as relevant.
## Cycling Level of Traffic Stress (LTS) accessibility workflow.
cycling_indicators:
  speed_limits:
    # Australia per-highway default speeds (km/h) and cycling permissibility,
    # from the GOHSC road-speeds CSV (Correspondence/Dar es Salaam/).
    defaults:
      trunk: 100
      trunk_link: 80
      primary: 80
      primary_link: 60
      secondary: 60
      secondary_link: 60
      tertiary: 50
      tertiary_link: 50
      residential: 50
      road: 50
      unclassified: 50
      living_street: 40
      service: 40
  no_cycle: [motorway, motorway_link, pedestrian, footway, corridor, steps]
  distances: [500, 1000, 2000, 5000]
  ## Accessibility measure contrasts: ordered pairs of measures calculated and
  ## juxtaposed in the validation report (the first pair is the established
  ## headline contrast; later pairs render below it as alternative contrasts
  ## for each reporting item).  Measures: lts1 (fully LTS 1 routes),
  ## low_stress (fully LTS 1-2 routes), low_stress_ride (as low_stress but
  ## ridden throughout, excluding links the rider would have to dismount and
  ## walk), danger_weighted (all streets routable, higher-stress length
  ## penalised).  Every measure named in a contrast is calculated; pairing
  ## low_stress_ride with low_stress also derives the dismount-dependence
  ## (dmgap_) indicators.  Default if omitted: [[low_stress, danger_weighted]].
  contrasts:
    - [low_stress, danger_weighted]
    - [lts1, low_stress]
    - [low_stress_ride, low_stress]
  ## Rank the individual links riders must dismount and walk by the population
  ## whose nearest-destination low-stress route depends on them — candidate
  ## locations for cycling infrastructure.  Requires routing_engine: inmemory
  ## and the [low_stress_ride, low_stress] contrast above.
  dismount_priority: true
  destinations:
    - {name: fresh_food_market,       category: food, variant: strict,  layer: destinations, where: "dest_name = 'fresh_food_market'"}
    - {name: fresh_food_pooled,       category: food, variant: lenient, layer: destinations, where: "dest_name IN ('fresh_food_market', 'convenience')"}
    - {name: public_open_space_large, category: pos,  variant: strict,  layer: aos_public_large_nodes_30m_line}
    - {name: public_open_space_any,   category: pos,  variant: lenient, layer: aos_public_any_nodes_30m_line}
    - {name: pt_frequent,             category: pt,   variant: strict,  layer: pt_stops_headway, where: "headway <= 20"}
    - {name: pt_any,                  category: pt,   variant: lenient, layer: destinations, where: "dest_name = 'pt_any'"}
  activity_centres:
    walk_threshold: 400
    categories: [food, pos, pt]
    tiers:
      local: lenient
      complete: strict
  validation:
    collaborator: Afshin Jafari, Mahsa Abdollahyar, Melanie Lowe, Carl Higgs & Ryan Turner (RMIT University)
    provenance:
      - "OpenStreetMap extract: victoria-latest.osm.pbf (Geofabrik, 2025-10-19)."
      - "Population: GHS-POP tile R14_C31 (EU JRC 2023, 100 m Mollweide)."
      - "GTFS feed: PTV (Public Transport Victoria), gtfs_au_vic_ptv_20191004.zip, valid 2019-10-04 to 2019-12-31; enables the pt_frequent (headway ≤20 min) destination variant."
      - "Speed defaults: Australian urban road hierarchy; motorway and motorway links excluded from cycling network."
    actions:
      - "Updated data from previous 2019 sources (official 2021 GCCSA boundary; 2026-07-07 OpenStreetMap data; official 2025 GTFS data); updated data may help with intersection crossing costs."
      - "Added in LGA custom aggregation to support policy relevant contrasts."
    limitations:
      - "Intersection crossing costs are not fully reflected in the LTS classification: in Taylors Hill, streets north of Taylors Rd and west of Calder Park Drive can only be reached by crossing a major road, yet the current routing does not penalise that crossing — access may be overstated for such locations."
      - "At 5 km, the constraint shifts from infrastructure availability (low-stress network extent) to destination density, which is informative for low-density Australian cities but different in character from the 2 km results."
      - "Aggregation to Melbourne-wide results obscures intra-metropolitan variation; sub-area summaries (e.g., LGAs) would be more policy-relevant."