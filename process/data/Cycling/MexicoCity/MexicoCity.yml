## Optional custom destinations to import in addition to those from OpenStreetMap.
## Each key must be a destination category name used in indicators.yml (e.g. pt_any),
## configured with a category-level "replace" setting and a "data_sources" list of
## one or more data entries (multiple sources pooled within the one category;
## appropriate for distance-to-closest analyses).  "replace" relates to the category
## as a whole: set true to use the pooled custom data instead of the
## OpenStreetMap-derived destinations for that category (default false: supplement
## OpenStreetMap; custom data sources never replace one another).
## Imported data are restricted to the buffered urban study region.
## Provenance details for all custom Mexico City data (e-mailed by Tec de
## Monterrey collaborators, Jul 2026, archived with the correspondence PDF in the
## 'Re_ GOHSC Cycling Indicators for Mexico City' folder):
## Cycling/MexicoCity/MexicoCity_custom_data_provenance.md
