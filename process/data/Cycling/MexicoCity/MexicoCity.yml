## Cycling Level of Traffic Stress (LTS) accessibility workflow.
cycling_indicators:
  speed_limits:
    defaults:
      motorway: 100
      trunk: 80
      primary: 70
      secondary: 55
      tertiary: 50
      residential: 40
      living_street: 30
      service: 25
  no_cycle: [trunk, trunk_link, pedestrian, footway, path, steps, corridor]
  distances: [500, 1000, 2000, 5000]
  ## Accessibility measure contrasts: ordered pairs of measures calculated and
  ## juxtaposed in the validation report (the first pair is the established
  ## headline contrast; later pairs render below it as alternative contrasts
  ## for each reporting item).  Measures: lts1 (fully LTS 1 routes),
  ## low_stress (fully LTS 1-2 routes), low_stress_ride (as low_stress but
  ## ridden throughout, excluding links the rider would have to dismount and
  ## walk), danger_weighted (all streets routable, higher-stress length
  ## penalised).  Every measure named in a contrast is calculated; pairing
  ## low_stress_ride with low_stress also derives the dismount-dependence
  ## (dmgap_) indicators.  Default if omitted: [[low_stress, danger_weighted]].
  contrasts:
    - [low_stress, danger_weighted]
    - [lts1, low_stress]
    - [low_stress_ride, low_stress]
  ## Rank the individual links riders must dismount and walk by the population
  ## whose nearest-destination low-stress route depends on them — candidate
  ## locations for cycling infrastructure.  Requires routing_engine: inmemory
  ## and the [low_stress_ride, low_stress] contrast above.
  dismount_priority: true
  destinations:
    - {name: fresh_food_market,       category: food, variant: strict,  layer: destinations, where: "dest_name = 'fresh_food_market'"}
    - {name: fresh_food_pooled,       category: food, variant: lenient, layer: destinations, where: "dest_name IN ('fresh_food_market', 'convenience')"}
    - {name: public_open_space_large, category: pos,  variant: strict,  layer: aos_public_large_nodes_30m_line}
    - {name: public_open_space_any,   category: pos,  variant: lenient, layer: aos_public_any_nodes_30m_line}
    - {name: pt_frequent,             category: pt,   variant: strict,  layer: pt_stops_headway, where: "headway <= 20"}
    - {name: pt_any,                  category: pt,   variant: lenient, layer: destinations, where: "dest_name = 'pt_any'"}
  activity_centres:
    walk_threshold: 400
    categories: [food, pos, pt]
    tiers:
      local: lenient
      complete: strict
  validation:
    collaborator: Eugen Resendiz Bontrud, César Hernández Alcaraz & Gonzalo Peraza Mues (Tec de Monterrey)
    provenance:
      - "OpenStreetMap extract: mexico-latest.osm.pbf (Geofabrik, 2025-10-20)."
      - "Population: GHS-POP tile R7_C9 (EU JRC 2023, 100 m Mollweide)."
      - "Trunk, trunk_link, path, pedestrian, footway, steps, and corridor road types excluded from the cycling network, reflecting roads where cycling is not permitted or safe in CDMX."
      - "Custom destination data supplied by Tec de Monterrey collaborators (Jul 2026), supplementing OpenStreetMap: INEGI DENUE 202605 food POIs (fresh food + convenience, metro-wide); official CDMX + EdoMex PT stops; official CDMX/EdoMex/Hidalgo public open space incl. Bosque de Chapultepec (areas de valor ambiental). See Cycling/MexicoCity/MexicoCity_custom_data_provenance.md."
      - "GTFS feed (datos.cdmx.gob.mx, updated 2026-02-24) configured for pt_frequent, representative period Apr-Jun 2025."
    limitations:
      - "Both 2 km and 5 km accessibility distributions were judged as inaccurate by collaborators (1.1/1.2: No); detailed feedback in collaborator-supplied document (SharePoint link)."
      - "Bosque de Chapultepec is tagged as 'natural=wood'/'landuse=forest' in OSM rather than as a park; it is not included in the public open space layer despite being one of Mexico City's major urban parks."
      - "The fresh food definition may include chain convenience stores that collaborators consider inappropriate for the Mexico City context."
      - "Post-validation proposed action: re-run with custom POI and POS data, and validate with official CDMX datasets (BISIGET cycling network, Datos Abiertos CDMX)."
      - "Official PT stop and GTFS data cover CDMX (+ Mexibus/Mexicable corridors) only; pt_frequent is underestimated in EdoMex/Hidalgo parts of the metro region. pt_any (OSM + official, pooled) is the more reliable metro-wide PT measure."
      - "GTFS analysis window Apr-Jun 2025 excludes Tren El Insurgente (its calendar only covers 2026)."
      - "Official public open space is dense for CDMX proper only; outside CDMX ~15 EdoMex + 3 Hidalgo park polygons fall within the buffered region, so OSM remains the primary POS source there."
    actions:
      - "Implemented 5km study region buffer (for all analyses"
      - "Added custom fresh food/convenience (DENUE), public transport stops and public open space layers, and CDMX GTFS feed, pooled with OpenStreetMap defaults (2026-07-13)."
      - "Set up a companion 'Mexico City proper' (CDMX, 16 alcaldias) sensitivity analysis (Cycling/MexicoCityProper/MexicoCityProper.yml), where official data coverage is near-complete."
    survey_feedback:
      - "Eugen Resendiz & Rodrigo Leal (Tec de Monterrey): recommend using NOM-004-SEDATU-2023 and the Guía de Diseño Ciclista CDMX as the standard for defining safe cycling infrastructure (physical separation, intersection treatments, width, continuity)."
      - "Highlight CDMX open datasets for validation: BISIGET cycling infrastructure map, Datos Abiertos CDMX cycling network, collision records (SSC base ampliada)."
      - "Key additional destinations for Mexico City: tianguis (informal markets), abarroterias (corner stores), metro/BRT stations, and government service centres."
      - "OSM strengths in CDMX: most cycling infrastructure present with useful attributes (protection type, side of street); limitation: speed limits and street type data inconsistent — should be augmented with INEGI or Datos Abiertos CDMX official data."
