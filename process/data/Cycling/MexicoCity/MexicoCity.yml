    ## covering the full metropolitan region + 5km buffer; fresh-food SCIAN codes:
    ## meat/poultry/fish, fruit & veg, grains, dairy, other food retail, supermarkets.
    replace: false
    data_sources:
      - data: Cycling/MexicoCity/Re_ GOHSC Cycling Indicators for Mexico City/DENUE_CDMX_food.parquet -where "codigo_act IN ('461121','461122','461123','461130','461140','461150','461190','462111')"
        source: INEGI DENUE via Gonzalo Peraza Mues (Tec de Monterrey)
        publication_date: 2026-05-01
        url: https://www.inegi.org.mx/app/mapa/denue/
        licence: "Términos de Libre Uso MX (INEGI)"
        citation: "INEGI. (2026). Directorio Estadístico Nacional de Unidades Económicas (DENUE), release 202605 [Data set]. Food-related subset by G. Peraza Mues, Tecnológico de Monterrey."
  convenience:
