    ## per collaborator feedback these are convenience (not fresh food) destinations;
    ## pooled into the lenient fresh_food_pooled indicator.
    replace: false
    data_sources:
      - data: Cycling/MexicoCity/Re_ GOHSC Cycling Indicators for Mexico City/DENUE_CDMX_food.parquet -where "codigo_act IN ('461110','462112')"
        source: INEGI DENUE via Gonzalo Peraza Mues (Tec de Monterrey)
        publication_date: 2026-05-01
        url: https://www.inegi.org.mx/app/mapa/denue/
