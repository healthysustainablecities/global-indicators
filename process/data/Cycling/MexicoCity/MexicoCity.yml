## Optional custom areas of interest to import in addition to those from
## OpenStreetMap ('public_open_space' is currently the only supported key),
## configured with a category-level "replace" setting and a "data_sources"
## list of one or more data entries.  "replace" relates to the category as a
## whole: set true to use the pooled custom data instead of the
## OpenStreetMap-derived open space areas (default false: supplement
## OpenStreetMap; custom data sources never replace one another).  Imported
## data are restricted to the buffered urban study region.
areas_of_interest:
  ## Official public open space polygons: CDMX plazas públicas, áreas verdes
  ## inventory filtered to parks/plazas/protected areas (excluding road
  ## medians, school grounds, cemeteries etc.; the accent-free LIKE patterns
  ## sidestep the shapefile's encoding quirks), áreas de valor ambiental
  ## (incl. Bosque de Chapultepec), EdoMex CEPANAF parks and Hidalgo SIGEH
  ## parks.  Dense for CDMX proper only - supplements OpenStreetMap for the
  ## wider metropolitan region.
  public_open_space:
    ## Note: the plazas folder name inside the zip uses decomposed (NFD)
    ## accents as stored by macOS; the \u escapes below reproduce the exact
    ## zip entry name and should not be "tidied".
    replace: false
    data_sources:
      - data: "Cycling/MexicoCity/Re_ GOHSC Cycling Indicators for Mexico City/POS_MexicoCity.zip/Plazas pu\u2560\u00FCblicas de la Ciudad de Me\u2560\u00FCxico/Plazas_publicas_CDMX.shp"
        source: Plazas públicas CDMX, datos.cdmx.gob.mx, via Eugen Resendiz Bontrud (Tec de Monterrey)
        publication_date: 2022-03-02
        url: https://datos.cdmx.gob.mx/dataset/plazas-publicas-de-la-ciudad-de-mexico
        licence: "Open data (datos.cdmx.gob.mx portal terms)"
      - data: Cycling/MexicoCity/Re_ GOHSC Cycling Indicators for Mexico City/POS_MexicoCity.zip/inventario_areas_verdes_1/inventario_areas_verdes_1.shp -where "categoria_ LIKE 'Parques%' OR categoria_ = 'Plazas y jardines' OR categoria_ LIKE '%categor%a de protecci%n'"
        source: Inventario de áreas verdes CDMX (parks, plazas/gardens and protected areas categories only), datos.cdmx.gob.mx, via Eugen Resendiz Bontrud (Tec de Monterrey)
        publication_date: 2021-05-26
        url: https://datos.cdmx.gob.mx/dataset/inventario-de-areas-verdes-en-la-ciudad-de-mexico
        licence: "Open data (datos.cdmx.gob.mx portal terms)"
      - data: Cycling/MexicoCity/Re_ GOHSC Cycling Indicators for Mexico City/POS_MexicoCity.zip/areas_de_valor_ambiental/areas_de_valor_ambiental.shp
        source: Áreas de valor ambiental (urban forests incl. Bosque de Chapultepec), datos.cdmx.gob.mx, via Eugen Resendiz Bontrud (Tec de Monterrey)
        publication_date: 2021-05-29
        url: https://datos.cdmx.gob.mx/dataset/areas-de-valor-ambiental
        licence: "Open data (datos.cdmx.gob.mx portal terms)"
      - data: Cycling/MexicoCity/Re_ GOHSC Cycling Indicators for Mexico City/State of Mexico.zip/State of Mexico/Parks_EdoMex.gpkg
        source: Parks (Estado de México), CEPANAF visor, via Eugen Resendiz Bontrud (Tec de Monterrey)
        publication_date: 2026-07-11
        url: https://acvisor.edomex.gob.mx/CEPANAF/portal/visorCEPANAF.do
        licence: "Open data (gobierno del Estado de México portal terms)"
      - data: Cycling/MexicoCity/Re_ GOHSC Cycling Indicators for Mexico City/Parks_Hidalgo.geojson
        source: Parks (Estado de Hidalgo), SIGEH geoportal, via Eugen Resendiz Bontrud (Tec de Monterrey)
        publication_date: 2026-07-13
        url: https://sigeh.hidalgo.gob.mx/pags/h_mapas.php
        licence: "Open data (gobierno del Estado de Hidalgo portal terms)"
