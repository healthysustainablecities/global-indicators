---
project:
    units: m
    # Units used by the coordinate reference system
    units_full: metres
    # Full name for the units
    study_buffer: 5000
    # Study region buffer, to account for edge effects
    chunk_size: 100
    # when doing network analyses, data is processed in chunks
    # By reducing the chunk size (eg 500 instead of 1000) you can avoid memory errors on computers with less memory (eg a laptop with 8Gb ram)
    # Specifically, this can be useful if you notice that the Docker process has been 'Killed' when running the neighbourhood analysis script.
    multiprocessing: 6
    # Number of processors to use in multiprocessing scripts, if implemented.
    # Set this to the number of physical CPU cores you want the analysis to use.
    # It sets the per-region PostgreSQL parallelism applied when the region database is
    # created (max_parallel_workers / *_per_gather), which speeds the large in-query
    # spatial/network aggregations.  NOTE: it does NOT set the cycling routing
    # concurrency -- shortest-path routing is CPU-bound and oversubscribes if run one
    # batch per core, so that is auto-tuned conservatively (override only via
    # cycling_indicators.workers after testing on your machine).
    # Guidance for adapting to your computer:
    #   - A safe default is the number of physical cores (e.g. 4 on a typical laptop,
    #     6-8 on a workstation). Leave 1-2 cores free if you need the machine for other
    #     work while it runs.
    #   - Do NOT set it higher than your core count: this oversubscribes the CPU and
    #     usually makes analysis slower, not faster.
    #   - On a low-RAM machine (e.g. 8 Gb), prefer a lower value (2-4): more parallel
    #     workers means more memory used at once. If the Docker process is 'Killed',
    #     reduce this (and see chunk_size above).
    #   - It must not exceed the database server's max_worker_processes (default 8);
    #     PostgreSQL will silently cap the parallel workers if it does.
    default_codename: ES_Las_Palmas_2025
    # an optional default study region as defined in regions.yml, useful for debugging
    analysis_timezone: Australia/Melbourne
    # to have localised time estimates for when processes have commenced and finished, modify this (see https://en.wikipedia.org/wiki/List_of_tz_database_time_zones).
sql:
    admin_db: postgres
    # SQL settings to connect to Postgresql+Postgis Docker container
    db_host: gateway.docker.internal
    db_port: 5433
    db_user: postgres
    db_pwd: ghscic
sample_points:
    points_id: location_id
    # sampling points unique id
    points: sampling_points
    # name of point data locations used for sampling
    point_sampling_interval: 30
    # interval in metres along which network is to be sampled
network_analysis:
    # note: for cycling indicator purposes, we cannot restrict to foot access roads here - that must be done subsequently
    # e.g. some cycle only routes may be accessible by pedestrians
    # However, we should be more strict on exclusion of private/inaccessible road types (e.g. service roads other than alleys)
    openstreetmap_query: |
        ["highway"]
        ["area"!~"yes"]
        ["highway"!~"motorway|proposed|construction|abandoned|platform|raceway|emergency_bay"]
        ["service"!~"private|slipway|emergency_access|parking_aisle|driveway|drive-through"]
        ["access"!~"no|private|forestry|emergency|delivery|agricultural|customers|military|permit|unknown"]
    # query used for custom network in OSMnx.  It may be overridden for an
    # individual study region using 'openstreetmap_query' under its 'network'
    # section.  The former names for this parameter, 'pedestrian' and
    # 'network', are still read if present.
    neighbourhood_distance: 1000
    # sausage buffer network size  -- in units specified above
    accessibility_distance: 500
    # distance within which to evaluate access
    soft_threshold_slope: 5
    # For scaling binary cutoffs using a smooth transition; this parameter adjusts slope k of the transition
gtfs:
    # Project-wide defaults for GTFS public transport analysis, used when a
    # study region's own 'gtfs_feeds' section does not specify them.  A
    # feed may override 'modes' and 'analysis_period' individually.
    headway: pt_stops_headway
    # name of the output table of stops with headway (service frequency) statistics
    data_dir: transit_feeds
    # legacy shared folder for GTFS feeds, relative to process/data; feeds
    # are normally stored alongside a study region's other data instead
    analysis_period: ['07:00:00', '19:00:00']
    # representative time window analysed for service frequency (hh:mm:ss)
    default_modes:
        # route_type codes as per https://gtfs.org/schedule/reference/;
        # override here (or per feed) if a feed uses non-standard codes
        Tram       : {'route_types': [ 0], 'agency_id': null}
        Metro      : {'route_types': [ 1], 'agency_id': null}
        Rail       : {'route_types': [ 2], 'agency_id': null}
        Bus        : {'route_types': [ 3], 'agency_id': null}
        Ferry      : {'route_types': [ 4], 'agency_id': null}
        Cable tram : {'route_types': [ 5], 'agency_id': null}
        Aerial lift: {'route_types': [ 6], 'agency_id': null}
        Funicular  : {'route_types': [ 7], 'agency_id': null}
        Trolleybus : {'route_types': [11], 'agency_id': null}
        Monorail   : {'route_types': [12], 'agency_id': null}
documentation:
    authors:
    # Authors of project (for metadata)
    url:
    # Your URL (optional;  for metadata)
    individualname:
    # Name of contact person for analysis (for metadata)
    positionname:
    # Position of contact person conducting analysis (for metadata)
    email:
    # Contact e-mail (for metadata)
points_of_interest:
    destination_list: [supermarket_osm, bakery_osm, meat_seafood_osm, fruit_veg_osm, deli_osm, convenience_osm, petrolstation_osm, newsagent_osm, market_osm, pt_any]
    osm_destination_definitions: process/configuration/osm_destination_definitions.csv
